name: G1HLEEZRANGE200600FORCEBSTUDENT

defaults:
  - /task/G1/G1_hl_ee_compliance_pos_delta_force_b_student@_here_
  - _self_

command:
  # Only kz varies; kx and ky remain stiff at 600 N/m.
  net_pull_ee_compliance_stiffness_xyz_range:
    - [600.0, 600.0, 200.0]
    - [600.0, 600.0, 600.0]
  net_pull_ee_compliance_stiffness_levels: [600.0]
  net_pull_ee_compliance_stiffness_levels_prob: 0.30
  net_pull_ee_compliance_stiffness_xyz_anchors:
    - [600.0, 600.0, 200.0]
    - [600.0, 600.0, 600.0]
  net_pull_ee_compliance_stiffness_anchor_prob: 0.20
  net_pull_ee_compliance_stiffness_inverse_command: true
  synthetic_ee_target:
    enabled: true
    train_only: true
    prob: 0.25

observation:
  hl_policy:
    net_pull_ee_compliance_stiffness_command: {}

reward:
  ee_compliance:
    ee_force_compliance_tracking:
      stiffness: [600.0, 600.0, 200.0]
      max_offset: [0.25, 0.25, 0.25]
    ee_force_stiffness_consistency:
      weight: 3.0
      force_scale: 15.0
      sigma: 1.0
      force_deadband: 0.5
    ee_force_limit_penalty:
      stiffness: [600.0, 600.0, 200.0]
      force_limit: [15.0, 15.0, 15.0]
      use_command_stiffness: true
