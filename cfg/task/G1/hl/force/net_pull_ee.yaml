command:
  external_force_mode: net_pull
  net_pull_apply_pattern:
    - ".*hand_mimic"
  net_pull_force_range: [5.0, 30.0]
  # Match the low-level legacy force sampling cadence more closely:
  # about 40% zero-force windows, active duration 20-200 steps,
  # and 25-100 step transitions.
  net_pull_zero_prob: 1.0 # 0.4
  net_pull_ramp_up_range: [25, 100]
  net_pull_hold_range: [20, 200]
  net_pull_ramp_down_range: [25, 100]
  net_pull_rest_range: [20, 200]
  net_pull_xy_only: true
