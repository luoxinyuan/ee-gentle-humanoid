name: G1HLEEXYZRANGE300500FORCEBSTUDENT

defaults:
  - /task/G1/G1_hl_ee_compliance_pos_delta_force_b_student@_here_
  - /task/G1/hl/task/ee_compliance_xyz_range_300_500@_here_
  - _self_

command:
  # Keep the same sampling structure as the 200-600 independent-xyz task.
  net_pull_ee_compliance_stiffness_levels: [300.0, 350.0, 400.0, 450.0, 500.0]
  net_pull_ee_compliance_stiffness_levels_prob: 0.30
  net_pull_ee_compliance_stiffness_xyz_anchors:
    - [300.0, 300.0, 300.0]
    - [500.0, 500.0, 500.0]
    - [300.0, 500.0, 500.0]
    - [500.0, 300.0, 500.0]
    - [500.0, 500.0, 300.0]
    - [400.0, 500.0, 500.0]
    - [500.0, 400.0, 500.0]
    - [500.0, 500.0, 400.0]
  net_pull_ee_compliance_stiffness_anchor_prob: 0.20
  synthetic_ee_target:
    enabled: true
    train_only: true
    prob: 0.25

reward:
  ee_compliance:
    ee_force_compliance_tracking:
      stiffness: [300.0, 300.0, 300.0]
      max_offset: [0.25, 0.25, 0.25]
    ee_force_stiffness_consistency:
      weight: 3.0
      force_scale: 15.0
      sigma: 1.0
      force_deadband: 0.5
    ee_force_limit_penalty:
      stiffness: [300.0, 300.0, 300.0]
      force_limit: [15.0, 15.0, 15.0]
      use_command_stiffness: true
